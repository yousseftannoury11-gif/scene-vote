# Netlify config for DrumTune Pro (static app, no build step).
# If the drum-tuner folder is moved to its own repo, change publish to ".".
[build]
  publish = "drum-tuner"
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "microphone=(self)"
